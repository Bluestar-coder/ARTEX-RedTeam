services:
  postgres:
    image: postgres:16-alpine
    environment:
      # Postgres 账号/库名沿用 artex，不随产品改名：
      # 带连字符的角色/库名在 SQL 与连接串里需要额外引号，会破坏老部署兼容。
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artex-redteam:
    build: .
    # 镜像名固定为 bluestarcoder/artex-redteam；可用 ARTEX_REDTEAM_IMAGE 覆盖，
    # 旧变量名 ARTEX_IMAGE 仍兼容（新名优先）。
    # tag 同理：ARTEX_REDTEAM_TAG 优先，旧名 ARTEX_TAG 回退。
    image: ${ARTEX_REDTEAM_IMAGE:-${ARTEX_IMAGE:-bluestarcoder/artex-redteam:${ARTEX_REDTEAM_TAG:-${ARTEX_TAG:-latest}}}}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 环境变量统一改名为 ARTEX_REDTEAM_*；旧名 ARTEX_* 作为回退，老 .env 无需修改即可继续用。
      ARTEX_REDTEAM_PG_DSN: ${ARTEX_REDTEAM_PG_DSN:-${ARTEX_PG_DSN:-postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable}}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_REDTEAM_LLM_PROVIDER: ${ARTEX_REDTEAM_LLM_PROVIDER:-${ARTEX_LLM_PROVIDER:-}}
      ARTEX_REDTEAM_LLM_MODEL: ${ARTEX_REDTEAM_LLM_MODEL:-${ARTEX_LLM_MODEL:-}}
      ARTEX_REDTEAM_LLM_BASE_URL: ${ARTEX_REDTEAM_LLM_BASE_URL:-${ARTEX_LLM_BASE_URL:-}}
      ARTEX_REDTEAM_LLM_PROXY: ${ARTEX_REDTEAM_LLM_PROXY:-${ARTEX_LLM_PROXY:-}}
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # 把数据目录（含 jwt.key、SQLite 等）绑定到项目根目录的 data/，
      # 方便在宿主机直接查看/备份，容器重建也不丢。
      # 注意：宿主目录名**刻意沿用 data**（不改为 data-redteam），
      # 这样老用户升级后流量索引/jwt.key 都留在原地、不丢数据；
      # 容器内路径已改为 /app/data-redteam。
      - ./data:/app/data-redteam
      # 把项目根目录的 skills 挂进容器（覆盖镜像内置的 /app/skills）；
      # 改 skill 无需重建镜像，容器读的就是宿主机这份。
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
