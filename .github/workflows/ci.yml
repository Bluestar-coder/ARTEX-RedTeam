name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # 每天 03:17 UTC 跑一次重测试（-count=5 / db -count=20）
  workflow_dispatch:

permissions:
  contents: read

env:
  ARTEX_REDTEAM_PG_DSN: postgres://artex:artextest@127.0.0.1:5432/artex?sslmode=disable

jobs:
  test:
    # PR 与 main 的 push 跑快速四件套：build / vet / test / shuffle。
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artextest
          POSTGRES_DB: artex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex -d artex"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -count=1 -timeout 30m
      - run: go test ./... -shuffle=on -count=1 -timeout 40m

  heavy:
    # 定时/手动跑重复测试；PR 上不跑，避免拖慢合并。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artextest
          POSTGRES_DB: artex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex -d artex"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -count=5 -timeout 120m
      - run: go test ./db -count=20 -timeout 60m
