name: verify-release

# 独立于 release 构建的发布物验证：
# 在 GitHub 云端 runner（与构建 job 不同的运行环境）从 Docker Hub 拉取镜像，
# 校验 digest / 多架构 manifest，并以真实 PostgreSQL 起容器、访问 /setup。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要验证的 release tag（例如 v0.4.3）"
        required: true
        default: "v0.4.3"

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artextest
          POSTGRES_DB: artex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex -d artex"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      TAG: ${{ inputs.tag }}
      EXPECTED_DIGEST: "sha256:f41762b630ce6d5678baf77a34d23cd7de9a620925f43be05d0fa79606d4bdde"
    steps:
      - name: Pull v0.4.3 and latest, compare RepoDigest
        run: |
          set -euxo pipefail
          docker pull "bluestarcoder/artex-redteam:${TAG}"
          docker pull "bluestarcoder/artex-redteam:latest"
          dt=$(docker inspect --format '{{index .RepoDigests 0}}' "bluestarcoder/artex-redteam:${TAG}")
          dl=$(docker inspect --format '{{index .RepoDigests 0}}' "bluestarcoder/artex-redteam:latest")
          echo "digest ${TAG}   = ${dt}"
          echo "digest latest   = ${dl}"
          test "$dt" = "$dl"
          case "$dt" in
            *"${EXPECTED_DIGEST}") echo "digest matches CI build log";;
            *) echo "DIGEST MISMATCH: expected ${EXPECTED_DIGEST}"; exit 1;;
          esac

      - name: Check multi-arch manifest (linux/amd64 + linux/arm64)
        run: |
          set -euxo pipefail
          docker manifest inspect "bluestarcoder/artex-redteam:${TAG}" > manifest.json
          cat manifest.json
          python3 - <<'PY'
          import json
          d = json.load(open("manifest.json"))
          plats = {(m["platform"]["os"], m["platform"]["architecture"]) for m in d["manifests"]}
          print("platforms:", sorted(plats))
          assert ("linux", "amd64") in plats, "linux/amd64 missing"
          assert ("linux", "arm64") in plats, "linux/arm64 missing"
          print("OK: linux/amd64 and linux/arm64 present")
          PY

      - name: Run container against PostgreSQL and open /setup
        run: |
          set -euxo pipefail
          docker run -d --name artex-redteam-verify --network host \
            -e ARTEX_REDTEAM_PG_DSN='postgres://artex:artextest@127.0.0.1:5432/artex?sslmode=disable' \
            -e ARTEX_REDTEAM_VOLUME_CHECK_WAIT=0 \
            "bluestarcoder/artex-redteam:${TAG}"
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/api/health >/tmp/health.json 2>/dev/null; then break; fi
            sleep 1
          done
          echo "health: $(cat /tmp/health.json)"
          echo "auth status: $(curl -fsS http://127.0.0.1:8787/api/auth/status)"
          curl -fsS -o /tmp/setup.html -w 'setup_http=%{http_code} bytes=%{size_download}\n' http://127.0.0.1:8787/setup
          head -c 200 /tmp/setup.html; echo
          curl -fsS -X POST http://127.0.0.1:8787/api/auth/init \
            -H 'Content-Type: application/json' -d '{"password":"verify-Admin-Pass!"}' >/tmp/init.json
          echo "init: $(head -c 120 /tmp/init.json)"
          curl -fsS -X POST http://127.0.0.1:8787/api/auth/login \
            -H 'Content-Type: application/json' -d '{"username":"ARTEX-RedTeam","password":"verify-Admin-Pass!"}' >/tmp/login.json
          echo "login: $(head -c 80 /tmp/login.json)"
          docker logs --tail 40 artex-redteam-verify
          docker stop artex-redteam-verify

  package-smoke:
    # 真实 Release 包冒烟：下载 linux/amd64 zip → 校验 SHA256SUMS → 解压 →
    # 按 README 用 config.json + start.sh 启动 → 走 /setup、登录、建任务、
    # 资产页、流量页 → SIGTERM 停止并确认守护脚本不再拉起。
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artextest
          POSTGRES_DB: artex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex -d artex"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Download release package and verify SHA256SUMS
        run: |
          set -euxo pipefail
          PKG="artex-redteam-${TAG#v}-linux-amd64.zip"
          mkdir -p /tmp/release
          cd /tmp/release
          gh release download "${TAG}" --repo "${{ github.repository }}" \
            --pattern "${PKG}" --pattern SHA256SUMS --dir /tmp/release
          grep "${PKG}" SHA256SUMS | sha256sum -c -
          sha256sum "${PKG}"
          unzip -q "${PKG}" -d app
          ls -la app

      - name: Configure config.json and start via start.sh
        run: |
          set -euxo pipefail
          cd /tmp/release/app
          chmod +x artex-redteam start.sh
          cp config.example.json config.json
          python3 - <<'PY'
          import json
          json.dump({"database": {"dsn": "postgres://artex:artextest@127.0.0.1:5432/artex?sslmode=disable"}},
                    open("config.json", "w"), indent=2)
          print(open("config.json").read())
          PY
          unset ARTEX_REDTEAM_PG_DSN ARTEX_PG_DSN || true
          nohup ./start.sh -addr 127.0.0.1:18787 -proxy 127.0.0.1:18788 > start.log 2>&1 &
          echo $! > start.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18787/api/health >/tmp/health.json 2>/dev/null; then break; fi
            sleep 1
          done
          echo "health: $(cat /tmp/health.json)"
          head -5 start.log

      - name: Full user flow (setup -> login -> task -> assets -> traffic)
        run: |
          set -euxo pipefail
          cd /tmp/release/app
          echo "== 1. 首页/设置页 =="
          curl -fsS -o /tmp/index.html -w 'index_http=%{http_code} bytes=%{size_download}\n' http://127.0.0.1:18787/
          curl -fsS -o /tmp/setup.html -w 'setup_http=%{http_code} bytes=%{size_download}\n' http://127.0.0.1:18787/setup
          grep -q '__next' /tmp/setup.html
          echo "auth status: $(curl -fsS http://127.0.0.1:18787/api/auth/status)"
          echo "== 2. 首次设置管理员密码 =="
          curl -fsS -X POST http://127.0.0.1:18787/api/auth/init \
            -H 'Content-Type: application/json' -d '{"password":"smoke-Admin-Pass!"}' >/tmp/init.json
          echo "init: $(head -c 60 /tmp/init.json)..."
          echo "== 3. 登录 =="
          curl -fsS -X POST http://127.0.0.1:18787/api/auth/login \
            -H 'Content-Type: application/json' -d '{"username":"ARTEX-RedTeam","password":"smoke-Admin-Pass!"}' >/tmp/login.json
          python3 -c "import json;d=json.load(open('/tmp/login.json'));assert d.get('token');print('login_ok token_len=',len(d['token']))"
          TOKEN=$(python3 -c "import json;print(json.load(open('/tmp/login.json'))['token'])")
          echo "== 4. 建任务（种子域名 example.com） =="
          curl -fsS -X POST http://127.0.0.1:18787/api/tasks \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"description":"smoke","goal":"对 example.com 做资产侦察"}' >/tmp/task.json
          cat /tmp/task.json | head -c 300; echo
          TASK_ID=$(python3 -c "import json;print(json.load(open('/tmp/task.json'))['id'])")
          curl -fsS -o /tmp/taskpage.html -w 'task_page_http=%{http_code} bytes=%{size_download}\n' "http://127.0.0.1:18787/tasks/$TASK_ID"
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:18787/api/tasks >/tmp/tasks.json
          python3 -c "import json;d=json.load(open('/tmp/tasks.json'));print('tasks_count=',len(d.get('tasks',d if isinstance(d,list) else [])))"
          echo "== 5. 资产页 =="
          curl -fsS -o /tmp/assets.html -w 'assets_page_http=%{http_code} bytes=%{size_download}\n' http://127.0.0.1:18787/assets
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:18787/api/assets | head -c 300; echo
          echo "== 6. 流量页 =="
          curl -fsS -o /tmp/traffic.html -w 'traffic_page_http=%{http_code} bytes=%{size_download}\n' http://127.0.0.1:18787/traffic
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:18787/api/traffic | head -c 300; echo

      - name: Stop via SIGTERM and verify daemon does not restart
        run: |
          set -euxo pipefail
          cd /tmp/release/app
          PID=$(cat start.pid)
          echo "start.sh pid=$PID"
          kill -TERM "$PID"
          for i in $(seq 1 20); do
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 0.5
          done
          if kill -0 "$PID" 2>/dev/null; then echo "ERROR: start.sh still alive"; exit 1; fi
          sleep 5
          if pgrep -af 'artex-redteam' | grep -v verify-release; then
            echo "ERROR: server restarted after stop"; exit 1
          fi
          grep -q '已停止' start.log
          if curl -fsS --max-time 2 http://127.0.0.1:18787/api/health >/dev/null 2>&1; then
            echo "ERROR: port still serving after stop"; exit 1
          fi
          echo "daemon stopped cleanly, no restart"
          echo "===== start.log tail ====="
          tail -20 start.log
